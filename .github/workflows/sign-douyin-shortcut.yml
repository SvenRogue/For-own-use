name: Sign Douyin Live Photo Shortcut
on:
  push:
    branches:
      - tools/douyin-live-shortcut-20261014
    paths:
      - douyin-live-shortcut/workflow.xml.gz.b64
      - .github/workflows/sign-douyin-shortcut.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build clipboard-first Shortcut v4
        run: |
          python3 douyin-live-shortcut/build-v4.py
      - name: Sign with RoutineHub HubSign
        run: |
          curl --fail-with-body -sS -L --retry 2 --max-time 90 \
            -X POST https://hubsign.routinehub.services/sign \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://routinehub.co' \
            -H 'Referer: https://routinehub.co/' \
            --data-binary @douyin-live-shortcut/request.json \
            --output douyin-live-shortcut/DouyinLiveDownloader.shortcut
          python3 - <<'PY'
          from pathlib import Path
          f=Path("douyin-live-shortcut/DouyinLiveDownloader.shortcut")
          print("Signed output size:",f.stat().st_size, "signature",f.read_bytes()[:4])
          assert f.read_bytes()[:4]==b'AEA1', "Signing endpoint did not return a valid AEA1 Shortcut"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DouyinLiveDownloader-signed
          path: douyin-live-shortcut/DouyinLiveDownloader.shortcut
          if-no-files-found: error
      - name: Publish signed Shortcut on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add douyin-live-shortcut/DouyinLiveDownloader.shortcut
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish signed Douyin live-photo Shortcut [skip ci]"
          git push || echo "::warning::Could not push signed output; see workflow artifact"
